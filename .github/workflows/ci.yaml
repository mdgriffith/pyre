name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.14.0

      - name: Install TypeScript test dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --check

      - name: Build server WASM runtime
        run: |
          wasm-pack build --target web wasm
          mkdir -p packages/server/wasm
          cp wasm/pkg/pyre_wasm.js packages/server/wasm/
          cp wasm/pkg/pyre_wasm_bg.wasm packages/server/wasm/
          cp wasm/pkg/pyre_wasm.d.ts packages/server/wasm/
          cp wasm/pkg/pyre_wasm_bg.wasm.d.ts packages/server/wasm/

      - name: Typecheck TypeScript packages
        run: bun run typecheck

      - name: Build compiler for server fixtures
        run: cargo build --locked --bin pyre

      - name: Test server package
        run: bun run --cwd packages/server test

      - name: Build client engine for Rust integration tests
        working-directory: packages/client
        run: npm exec --yes --package=elm@0.19.1-6 -- bash ./scripts/build.sh --optimize

      - name: Test Elm reconciliation
        working-directory: packages/client
        run: |
          mkdir -p ../../target/tmp
          TMPDIR="$PWD/../../target/tmp" npm exec --yes --package=elm@0.19.1-6 --package=elm-test@0.19.1-revision17 -- elm-test

      - name: Run tests
        run: cargo test --locked

      - name: Test local-edit lifecycle and publication boundaries
        run: node --test tests/local-edit-boundaries.test.mjs
