name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.14.0

      - name: Install TypeScript test dependencies
        run: bun install --frozen-lockfile

      - name: Install Elm and browser test tools
        run: |
          npm install --global elm@0.19.1-6 elm-test@0.19.1-revision17 playwright@1.62.1
          playwright install --with-deps chromium

      - name: Build client worker
        working-directory: packages/client
        run: bash scripts/build.sh

      - name: Check formatting
        run: cargo fmt --check

      - name: Build server WASM runtime
        run: |
          wasm-pack build --target web wasm
          mkdir -p packages/server/wasm
          cp wasm/pkg/pyre_wasm.js packages/server/wasm/
          cp wasm/pkg/pyre_wasm_bg.wasm packages/server/wasm/
          cp wasm/pkg/pyre_wasm.d.ts packages/server/wasm/
          cp wasm/pkg/pyre_wasm_bg.wasm.d.ts packages/server/wasm/

      - name: Typecheck TypeScript packages
        run: bun run typecheck

      - name: Test server package
        run: bun run --cwd packages/server test

      - name: Test client worker and bridge
        working-directory: packages/client
        run: |
          elm-test
          bun test src-ts

      - name: Native two-client proof
        working-directory: packages/client
        run: bun scripts/field-edit-proof.ts

      - name: Run tests
        run: cargo test --locked

      - name: Test remote disposable workflows against libSQL
        env:
          PYRE_TEST_SQLD_URL: http://127.0.0.1:18080
        run: |
          docker run -d --rm --name pyre-test-sqld -p 127.0.0.1:18080:8080 \
            -e SQLD_HTTP_LISTEN_ADDR=0.0.0.0:8080 ghcr.io/tursodatabase/libsql-server:v0.24.32
          trap 'docker stop pyre-test-sqld' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 3 "$PYRE_TEST_SQLD_URL/health"
          cargo test --locked --test commands db_remote_reset_and_reseed_through_hrana
